<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luz de Rosto">
<meta name="theme-color" content="#ffffff">
<title>Luz de Rosto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Manrope:wght@500;700&display=swap">
<style>
:root{
  --light:#ffffff;          /* cor da luz (anel + fundo) */
  --bgdim:1;                /* brilho do fundo em volta do anel */
  --ink:#1a1209; --panel:rgba(18,15,12,.72); --fg:#f4ede4; --muted:#b8ad9f; --accent:#ffb45c;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}

/* fundo: luz em toda a tela */
#bg{position:fixed;inset:0;background:var(--light);filter:brightness(var(--bgdim))}

/* janela da câmera */
#win{position:fixed;overflow:hidden;background:#000;z-index:2}
#win.circle{border-radius:50%}
#win.frame{border-radius:22px}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
body.nomirror video{transform:none}

/* o anel (ring light) desenhado em volta da janela */
#ring{position:fixed;z-index:1;pointer-events:none;background:var(--light);
  box-shadow:
    0 0 0 2px rgba(0,0,0,.18),
    0 0 40px 12px var(--light),
    0 0 110px 40px var(--light);
}
#ring.circle{border-radius:50%}
#ring.frame{border-radius:40px}
/* aro escuro fino nas bordas do anel, como a carcaça de um ring light */
#ring::after{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.16), inset 0 0 18px 2px rgba(255,255,255,.9)}
#rimIn{position:fixed;z-index:3;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.16), 0 0 22px 6px rgba(255,255,255,.55)}
#rimIn.circle{border-radius:50%}
#rimIn.frame{border-radius:22px}

#flash{position:fixed;inset:0;background:var(--light);opacity:0;pointer-events:none;z-index:9}
#flash.on{opacity:1}
#count{position:fixed;left:50%;transform:translate(-50%,-50%);font:600 24vmin var(--display);color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.55);z-index:8;pointer-events:none}

/* menu inferior, encostado embaixo */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:10px 14px;color:var(--fg);display:grid;gap:4px}
body.clean .card{display:none}
.row{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:10px}
.row label{font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-8px}
#temp::-webkit-slider-runnable-track{background:linear-gradient(90deg,#9cc6ff,#fff,#ffb45c)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.tg{font:700 11.5px var(--body);color:var(--fg);background:rgba(255,255,255,.12);border:0;border-radius:99px;padding:7px 10px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.shutter-row{display:flex;align-items:center;justify-content:center;gap:30px}
.side{width:50px;height:50px;border-radius:50%;border:0;background:var(--panel);color:var(--fg);font:700 11.5px var(--body);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#shot{width:74px;height:74px;border-radius:50%;border:5px solid rgba(18,15,12,.8);background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.18);cursor:pointer}
#shot:active{transform:scale(.94)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* telas de início e resultado */
.overlay{position:fixed;inset:0;z-index:20;background:#0f0d0b;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.overlay[hidden]{display:none}
.overlay h1{font:600 22px var(--display);margin:0}
.overlay p{margin:0;color:var(--muted);font-size:14.5px;max-width:32ch;line-height:1.45}
.big{font:700 16px var(--body);border:0;border-radius:14px;padding:15px 22px;background:#fff;color:var(--ink);cursor:pointer;min-width:230px}
.ghost{background:rgba(255,255,255,.12);color:var(--fg)}
.ringicon{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 14px #fff,0 0 50px 22px rgba(255,255,255,.6);background:#1a1714}
#resImg{max-width:100%;max-height:62vh;border-radius:14px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#resInfo{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ring" class="circle"></div>
<div id="win" class="circle"><video id="vid" playsinline autoplay muted></video></div>
<div id="rimIn" class="circle"></div>
<div id="flash"></div>
<div id="count" hidden></div>

<div class="dock" id="dock">
  <div class="card">
    <div class="row"><label for="size">Tamanho</label><input id="size" type="range" min="50" max="100" value="78"></div>
    <div class="row"><label for="ringw">Anel de luz</label><input id="ringw" type="range" min="4" max="22" value="13"></div>
    <div class="row"><label for="temp">Cor da luz</label><input id="temp" type="range" min="-100" max="100" value="0"></div>
    <div class="row"><label for="bgl">Luz do fundo</label><input id="bgl" type="range" min="55" max="100" value="82"></div>
    <div class="toggles">
      <button class="tg" id="tView" aria-pressed="false">Ver foto 3:4</button>
      <button class="tg" id="tFlash" aria-pressed="true">Flash</button>
      <button class="tg" id="tTimer" aria-pressed="false">Timer 3s</button>
      <button class="tg" id="tMirror" aria-pressed="true">Espelhar</button>
    </div>
  </div>
  <div class="shutter-row">
    <button class="side" id="hideBtn" aria-label="Esconder ajustes">Ajustes</button>
    <button id="shot" aria-label="Tirar foto"></button>
    <button class="side" id="flip" aria-label="Trocar câmera">Virar</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="ringicon" aria-hidden="true"></div>
  <h1>Luz de Rosto</h1>
  <p>A tela vira um ring light e ilumina seu rosto. Coloque o brilho do iPhone no máximo para ter mais luz.</p>
  <button class="big" id="go">Abrir câmera</button>
  <p id="err" role="alert"></p>
</div>

<div class="overlay" id="result" hidden>
  <img id="resImg" alt="Sua foto">
  <div id="resInfo"></div>
  <div class="btns">
    <button class="big" id="saveBtn">Salvar na galeria</button>
    <button class="big ghost" id="again">Tirar outra</button>
  </div>
  <p>No menu que abrir, toque em <b>Salvar Imagem</b>. Se não abrir, toque e segure a foto e escolha Salvar na Fotos.</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const vid = $('vid'), win = $('win'), ring = $('ring'), rimIn = $('rimIn'), root = document.documentElement, body = document.body;
  let stream = null, facing = 'user', lastBlob = null;
  const opt = {flash:true, timer:false, mirror:true, frame:false};

  // ---------- cor e brilho da luz ----------
  function applyLight(){
    const t = +$('temp').value/100;
    const n=[255,255,255], w=[255,200,140], c=[170,208,255], to=t>=0?w:c, k=Math.abs(t);
    const col = n.map((v,i)=>Math.round(v+(to[i]-v)*k));
    const css = `rgb(${col.join(',')})`;
    root.style.setProperty('--light', css);
    root.style.setProperty('--bgdim', (+$('bgl').value/100).toFixed(2));
    document.querySelector('meta[name=theme-color]').setAttribute('content', css);
  }

  // ---------- posição da janela e do anel ----------
  function layout(){
    const W = innerWidth, H = innerHeight;
    const dockH = $('dock').getBoundingClientRect().height;
    const top = parseFloat(getComputedStyle(root).getPropertyValue('--sat')) || 0;
    const availTop = top + 12, availH = H - dockH - availTop - 8;
    const cy = availTop + availH/2, cx = W/2;
    const s = +$('size').value/100;
    const ringPx = Math.round(Math.min(W, availH) * (+$('ringw').value/100));
    let w, h;
    if (opt.frame){
      h = Math.min(availH - ringPx*2, (W - ringPx*2 - 16) * 4/3) * s;
      w = h * 3/4;
    } else {
      w = h = Math.min(W - ringPx*2 - 16, availH - ringPx*2) * s;
    }
    const place = (el, ww, hh) => Object.assign(el.style, {left:(cx-ww/2)+'px', top:(cy-hh/2)+'px', width:ww+'px', height:hh+'px'});
    place(win, w, h); place(rimIn, w, h); place(ring, w + ringPx*2, h + ringPx*2);
    $('count').style.top = cy + 'px';
    [win, ring, rimIn].forEach(el => { el.classList.toggle('circle', !opt.frame); el.classList.toggle('frame', opt.frame); });
  }
  // lê a área segura do topo (notch / Dynamic Island)
  root.style.setProperty('--sat', 'env(safe-area-inset-top,0px)');
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);visibility:hidden';
  document.body.appendChild(probe);
  const readSafe = () => root.style.setProperty('--sat', probe.getBoundingClientRect().height);

  ['temp','bgl'].forEach(id => $(id).addEventListener('input', applyLight));
  ['size','ringw'].forEach(id => $(id).addEventListener('input', layout));
  addEventListener('resize', () => { readSafe(); layout(); });

  // ---------- botões ----------
  function toggle(btn, key, fn){
    btn.addEventListener('click', () => { opt[key] = !opt[key]; btn.setAttribute('aria-pressed', String(opt[key])); fn && fn(); });
  }
  toggle($('tView'), 'frame', layout);
  toggle($('tFlash'), 'flash');
  toggle($('tTimer'), 'timer');
  toggle($('tMirror'), 'mirror', () => body.classList.toggle('nomirror', facing !== 'user' || !opt.mirror));
  $('hideBtn').addEventListener('click', () => {
    body.classList.toggle('clean');
    $('hideBtn').textContent = body.classList.contains('clean') ? 'Mostrar' : 'Ajustes';
    layout();
  });

  // ---------- câmera, na maior resolução que o navegador libera ----------
  async function startCam(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:facing, width:{ideal:4032}, height:{ideal:3024}, aspectRatio:{ideal:4/3}}
    });
    vid.srcObject = stream;
    await vid.play().catch(()=>{});
    body.classList.toggle('nomirror', facing !== 'user' || !opt.mirror);
  }
  async function keepAwake(){ try { await navigator.wakeLock?.request('screen'); } catch(e){} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });

  $('go').addEventListener('click', async () => {
    $('err').textContent = '';
    if (!navigator.mediaDevices?.getUserMedia){ $('err').textContent = 'Este navegador não libera a câmera. Abra o link no Safari.'; return; }
    try {
      await startCam(); $('start').hidden = true; applyLight(); readSafe(); layout(); keepAwake();
    } catch(e){
      const framed = window.top !== window.self;
      $('err').textContent = framed
        ? 'A câmera fica bloqueada quando o app abre dentro de outra página. Abra pelo link próprio do app no Safari.'
        : 'Não consegui acessar a câmera. Toque em "aA" na barra do Safari, depois em Ajustes do Site, e permita a Câmera.';
    }
  });
  $('flip').addEventListener('click', async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCam(); } catch(e){ facing = 'user'; startCam(); }
  });

  // ---------- foto: quadro inteiro da câmera, proporção 3:4 ----------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function capture(){
    if (!stream) return;
    if (opt.timer){
      const c = $('count'); c.hidden = false;
      for (let i=3;i>0;i--){ c.textContent = i; await wait(1000); }
      c.hidden = true;
    }
    if (opt.flash){ $('flash').classList.add('on'); await wait(450); }

    const vw = vid.videoWidth, vh = vid.videoHeight;
    // 3:4 em pé (como a câmera frontal do iPhone)
    let sw = vw, sh = vh, sx = 0, sy = 0;
    const target = 3/4;
    if (vw/vh > target){ sw = Math.round(vh*target); sx = Math.round((vw-sw)/2); }
    else { sh = Math.round(vw/target); sy = Math.round((vh-sh)/2); }

    const cv = document.createElement('canvas');
    cv.width = sw; cv.height = sh;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (facing === 'user' && opt.mirror){ ctx.translate(sw,0); ctx.scale(-1,1); }
    ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);

    if (opt.flash){ await wait(100); $('flash').classList.remove('on'); }

    cv.toBlob(b => {
      lastBlob = b;
      $('resImg').src = URL.createObjectURL(b);
      $('resInfo').textContent = `${sw} × ${sh} px · JPEG qualidade máxima · ${(b.size/1048576).toFixed(1)} MB`;
      $('result').hidden = false;
    }, 'image/jpeg', 1);
  }
  $('shot').addEventListener('click', capture);

  // ---------- salvar ----------
  function fileName(){
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    return `IMG_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  }
  $('saveBtn').addEventListener('click', async () => {
    if (!lastBlob) return;
    const file = new File([lastBlob], fileName(), {type:'image/jpeg'});
    if (navigator.canShare?.({files:[file]})){
      try { await navigator.share({files:[file]}); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob); a.download = file.name; a.click();
  });
  $('again').addEventListener('click', () => { $('result').hidden = true; });

  applyLight(); readSafe(); layout();
})();
</script>
</body>
</html>
