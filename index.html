<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luz de Rosto">
<meta name="theme-color" content="#ffffff">
<title>Luz de Rosto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Manrope:wght@500;700&display=swap">
<style>
:root{
  --ring:#ffffff; --ink:#1a1209; --panel:rgba(20,17,14,.78); --fg:#f4ede4; --muted:#b8ad9f; --accent:#ffb45c;
  --hole:72vmin; --edge:9vmin;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ring);overflow:hidden;font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#light{position:fixed;inset:0;background:var(--ring);transition:background .2s}
/* camera window */
#win{position:fixed;left:50%;top:calc(42% + env(safe-area-inset-top,0px)/2);width:var(--hole);height:var(--hole);transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
body.rect #win{left:var(--edge);right:var(--edge);top:calc(var(--edge) + env(safe-area-inset-top,0px));bottom:calc(var(--edge) + 210px + env(safe-area-inset-bottom,0px));width:auto;height:auto;transform:none;border-radius:28px}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
body.nomirror video{transform:none}
#flash{position:fixed;inset:0;background:var(--ring);opacity:0;pointer-events:none;z-index:9}
#flash.on{opacity:1}
#count{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:600 22vmin var(--display);color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5);z-index:8;pointer-events:none}
/* controls */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:5}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:12px 14px;color:var(--fg);display:grid;gap:8px}
.row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px}
.row label{font-size:12.5px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px}
#temp::-webkit-slider-runnable-track{background:linear-gradient(90deg,#9cc6ff,#fff,#ffb45c)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{font:700 12px var(--body);color:var(--fg);background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:7px 11px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.shutter-row{display:flex;align-items:center;justify-content:center;gap:28px}
.side{width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);color:var(--fg);font:700 12px var(--body);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#shot{width:76px;height:76px;border-radius:50%;border:5px solid var(--panel);background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.15);cursor:pointer}
#shot:active{transform:scale(.94)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#hideBtn{display:block}
body.clean .card{display:none}
/* start + result */
.overlay{position:fixed;inset:0;z-index:20;background:#0f0d0b;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.overlay[hidden]{display:none}
.overlay h1{font:600 22px var(--display);margin:0}
.overlay p{margin:0;color:var(--muted);font-size:14.5px;max-width:32ch;line-height:1.45}
.big{font:700 16px var(--body);border:0;border-radius:14px;padding:15px 22px;background:#fff;color:var(--ink);cursor:pointer;min-width:220px}
.ghost{background:rgba(255,255,255,.12);color:var(--fg)}
.ringicon{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 12px #fff,0 0 40px 18px rgba(255,220,170,.55);background:#1a1714}
#resImg{max-width:100%;max-height:60vh;border-radius:16px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){#light{transition:none}}
</style>
</head>
<body>
<div id="light"></div>
<div id="win"><video id="vid" playsinline autoplay muted></video></div>
<div id="flash"></div>
<div id="count" hidden></div>

<div class="dock">
  <div class="card">
    <div class="row"><label for="size">Tamanho</label><input id="size" type="range" min="45" max="92" value="72"></div>
    <div class="row"><label for="temp">Cor da luz</label><input id="temp" type="range" min="-100" max="100" value="0"></div>
    <div class="row"><label for="pow">Intensidade</label><input id="pow" type="range" min="40" max="100" value="100"></div>
    <div class="toggles">
      <button class="tg" id="tShape" aria-pressed="true">Círculo</button>
      <button class="tg" id="tFlash" aria-pressed="true">Flash na foto</button>
      <button class="tg" id="tTimer" aria-pressed="false">Timer 3s</button>
      <button class="tg" id="tMirror" aria-pressed="true">Espelhar</button>
    </div>
  </div>
  <div class="shutter-row">
    <button class="side" id="hideBtn" aria-label="Esconder ajustes">Ajustes</button>
    <button id="shot" aria-label="Tirar foto"></button>
    <button class="side" id="flip" aria-label="Trocar câmera">Virar</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="ringicon" aria-hidden="true"></div>
  <h1>Luz de Rosto</h1>
  <p>A tela vira um ring light e ilumina seu rosto. Coloque o brilho do iPhone no máximo para ter mais luz.</p>
  <button class="big" id="go">Abrir câmera</button>
  <p id="err" role="alert"></p>
</div>

<div class="overlay" id="result" hidden>
  <img id="resImg" alt="Sua foto">
  <div class="btns">
    <button class="big" id="saveBtn">Salvar foto (PNG)</button>
    <button class="big ghost" id="again">Tirar outra</button>
  </div>
  <p id="saveHint">Se o botão não abrir, toque e segure a foto e escolha Salvar na Fotos.</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const vid = $('vid'), root = document.documentElement, body = document.body;
  let stream = null, facing = 'user', lastBlob = null, wake = null;
  const opt = {flash:true, timer:false, mirror:true, circle:true};

  // ----- light color -----
  function applyLight(){
    const t = +$('temp').value/100, p = +$('pow').value/100;
    const n=[255,255,255], w=[255,196,130], c=[165,205,255], to = t>=0?w:c, k=Math.abs(t);
    const col = n.map((v,i)=>Math.round((v+(to[i]-v)*k)*p));
    const css = `rgb(${col.join(',')})`;
    root.style.setProperty('--ring', css);
    document.querySelector('meta[name=theme-color]').setAttribute('content', css);
  }
  ['temp','pow'].forEach(id => $(id).addEventListener('input', applyLight));
  $('size').addEventListener('input', e => {
    root.style.setProperty('--hole', e.target.value+'vmin');
    root.style.setProperty('--edge', Math.max(3, (100-e.target.value)/3)+'vmin');
  });

  // ----- toggles -----
  function toggle(btn, key, fn){
    btn.addEventListener('click', () => { opt[key] = !opt[key]; btn.setAttribute('aria-pressed', String(opt[key])); fn && fn(); });
  }
  toggle($('tShape'), 'circle', () => { body.classList.toggle('rect', !opt.circle); $('tShape').textContent = opt.circle ? 'Círculo' : 'Borda'; $('tShape').setAttribute('aria-pressed','true'); });
  toggle($('tFlash'), 'flash');
  toggle($('tTimer'), 'timer');
  toggle($('tMirror'), 'mirror', () => body.classList.toggle('nomirror', !opt.mirror));
  $('hideBtn').addEventListener('click', () => { body.classList.toggle('clean'); $('hideBtn').textContent = body.classList.contains('clean') ? 'Mostrar' : 'Ajustes'; });

  // ----- camera -----
  async function startCam(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1920}}, audio:false
    });
    vid.srcObject = stream;
    await vid.play().catch(()=>{});
    body.classList.toggle('nomirror', facing !== 'user' || !opt.mirror);
  }
  async function keepAwake(){
    try { wake = await navigator.wakeLock?.request('screen'); } catch(e){}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });

  $('go').addEventListener('click', async () => {
    $('err').textContent = '';
    if (!navigator.mediaDevices?.getUserMedia){ $('err').textContent = 'Este navegador não libera a câmera. Abra o link no Safari.'; return; }
    try { await startCam(); $('start').hidden = true; applyLight(); keepAwake(); }
    catch(e){
      const blocked = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') && window.top !== window.self;
      $('err').textContent = blocked
        ? 'A câmera fica bloqueada quando o app abre dentro de outra página. Abra pelo link próprio do app no Safari.'
        : 'Não consegui acessar a câmera. Toque em "aA" na barra do Safari, depois em Ajustes do Site, e permita a Câmera.';
    }
  });
  $('flip').addEventListener('click', async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCam(); } catch(e){ facing = 'user'; startCam(); }
  });

  // ----- capture -----
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function capture(){
    if (!stream) return;
    if (opt.timer){
      const c = $('count'); c.hidden = false;
      for (let i=3;i>0;i--){ c.textContent = i; await wait(1000); }
      c.hidden = true;
    }
    if (opt.flash){ $('flash').classList.add('on'); await wait(350); }

    const vw = vid.videoWidth, vh = vid.videoHeight;
    const cv = document.createElement('canvas');
    let sx=0, sy=0, sw=vw, sh=vh;
    if (opt.circle){ // square crop matching the round window
      const s = Math.min(vw, vh); sx=(vw-s)/2; sy=(vh-s)/2; sw=sh=s;
    } else { // crop to the window's aspect
      const r = $('win').getBoundingClientRect(), ar = r.width/r.height;
      if (vw/vh > ar){ sw = vh*ar; sx = (vw-sw)/2; } else { sh = vw/ar; sy = (vh-sh)/2; }
    }
    cv.width = Math.round(sw); cv.height = Math.round(sh);
    const ctx = cv.getContext('2d');
    if (facing === 'user' && opt.mirror){ ctx.translate(cv.width,0); ctx.scale(-1,1); }
    ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, cv.width, cv.height);

    if (opt.flash){ await wait(120); $('flash').classList.remove('on'); }

    cv.toBlob(b => {
      lastBlob = b;
      $('resImg').src = URL.createObjectURL(b);
      $('result').hidden = false;
    }, 'image/png');
  }
  $('shot').addEventListener('click', capture);

  // ----- save -----
  function fileName(){
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    return `luz-de-rosto-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
  }
  $('saveBtn').addEventListener('click', async () => {
    if (!lastBlob) return;
    const file = new File([lastBlob], fileName(), {type:'image/png'});
    if (navigator.canShare?.({files:[file]})){
      try { await navigator.share({files:[file]}); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob); a.download = file.name; a.click();
  });
  $('again').addEventListener('click', () => { $('result').hidden = true; });

  applyLight();
})();
</script>
</body>
</html>
