<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luz">
<meta name="theme-color" content="#0b0b0a">
<title>Luz de Rosto</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500&display=swap">
<style>
/* Camera de estudio: luz branca pura, controles em vidro fume, um unico gesto por tela */
:root{
  --light:#ffffff;
  --bgdim:.82;
  --noir:#0b0b0a;
  --glass:rgba(14,14,13,.62);
  --hair:rgba(255,255,255,.14);
  --fg:#f5f3ef;
  --mute:rgba(245,243,239,.52);
  --gold:#d9c3a0;
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--noir);font-family:var(--sans);font-weight:400;color:var(--fg);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
svg{display:block}

/* ---------- luz ---------- */
#bg{position:fixed;inset:0;background:var(--light);filter:brightness(var(--bgdim));transition:filter .25s}
#ring{position:fixed;z-index:1;pointer-events:none;background:var(--light);
  box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 0 60px 18px var(--light),0 0 140px 50px var(--light)}
#win{position:fixed;overflow:hidden;background:#000;z-index:2;box-shadow:0 0 0 .5px rgba(0,0,0,.12),inset 0 0 30px rgba(0,0,0,.25)}
.circle{border-radius:50%}
#win.frame{border-radius:18px}
#ring.frame{border-radius:34px}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
body.nomirror video{transform:none}
#flash{position:fixed;inset:0;background:var(--light);opacity:0;pointer-events:none;z-index:30;transition:opacity .08s}
#flash.on{opacity:1}
#count{position:fixed;left:50%;transform:translate(-50%,-50%);font:300 26vmin/1 var(--sans);letter-spacing:-.04em;color:#fff;text-shadow:0 0 40px rgba(0,0,0,.35);z-index:8;pointer-events:none;font-variant-numeric:tabular-nums}

/* ---------- vidro ---------- */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 0 0 .5px var(--hair)}

/* barra superior */
.top{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;padding:4px;border-radius:99px}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:color .2s,background .2s}
.ico[aria-pressed="true"]{color:var(--noir);background:var(--fg)}
.ico svg{width:19px;height:19px}
.seg{font:500 11px var(--sans);letter-spacing:.14em;width:auto;padding:0 14px;border-radius:99px}

/* barra inferior */
.dock{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:0 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.bar{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:99px}
.bar .ico{width:48px;height:48px;color:var(--fg)}
.bar .ico svg{width:21px;height:21px}
#shot{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9)}
#shot i{width:56px;height:56px;border-radius:50%;background:#fff;transition:transform .12s}
#shot:active i{transform:scale(.9)}

/* painel de ajustes */
.sheet{width:100%;max-width:420px;border-radius:26px;padding:18px 20px 14px;display:grid;gap:14px;transform-origin:bottom center;transition:opacity .22s,transform .22s}
.sheet[hidden]{display:grid!important;opacity:0;transform:translateY(8px) scale(.98);pointer-events:none}
.field{display:grid;gap:7px}
.field .lab{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.field .lab output{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(255,255,255,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 1px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:1px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
#temp::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#a9cdfa,#fff 50%,#f3c38c)}
.switch{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding-top:2px;border-top:.5px solid var(--hair);padding-block:12px 0}
.tog{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed="true"]{background:var(--gold)}
.tog[aria-pressed="true"]::after{transform:translateX(18px)}

/* ---------- telas pretas ---------- */
.screen{position:fixed;inset:0;z-index:20;background:var(--noir);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(36px + env(safe-area-inset-top,0px)) 28px calc(30px + env(safe-area-inset-bottom,0px));text-align:center}
.screen[hidden]{display:none}
.eyebrow{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
.mid{display:flex;flex-direction:column;align-items:center;gap:26px}
.halo{width:132px;height:132px;border-radius:50%;box-shadow:inset 0 0 0 7px #fff,0 0 34px 6px rgba(255,255,255,.28),0 0 90px 24px rgba(255,248,236,.12);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:inset 0 0 0 7px #fff,0 0 44px 10px rgba(255,255,255,.38),0 0 110px 34px rgba(255,248,236,.18)}}
.mark{font:400 52px/1 var(--serif);letter-spacing:-.01em;margin:0}
.mark em{font-style:italic;color:var(--gold)}
.lead{margin:0;font-size:14px;font-weight:300;line-height:1.6;color:var(--mute);max-width:28ch}
.cta{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.pill{width:100%;max-width:320px;height:54px;border-radius:99px;background:var(--fg);color:var(--noir);font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.link{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding:10px}
.note{font-size:12.5px;font-weight:300;line-height:1.5;color:#e7a98f;max-width:30ch;min-height:1em;margin:0}

#result{justify-content:center;gap:22px}
#resImg{max-width:100%;max-height:64vh;border-radius:6px;box-shadow:0 0 0 .5px var(--hair);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#resInfo{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.hint{font-size:12px;font-weight:300;color:var(--mute);max-width:30ch;line-height:1.5;margin:0}

@media (prefers-reduced-motion:reduce){.halo{animation:none}.sheet,#bg{transition:none}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ring" class="circle"></div>
<div id="win" class="circle"><video id="vid" playsinline autoplay muted></video></div>
<div id="flash"></div>
<div id="count" hidden></div>

<!-- barra superior -->
<div class="top glass" id="top">
  <button class="ico" id="tFlash" aria-pressed="true" aria-label="Flash na foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6l1-8Z"/></svg>
  </button>
  <button class="ico" id="tTimer" aria-pressed="false" aria-label="Timer de 3 segundos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
  </button>
  <button class="ico seg" id="tView" aria-pressed="false" aria-label="Ver enquadramento 3:4">3:4</button>
</div>

<!-- barra inferior -->
<div class="dock" id="dock">
  <div class="sheet glass" id="sheet" hidden>
    <div class="field">
      <div class="lab"><label for="size">Tamanho</label><output id="sizeV"></output></div>
      <input id="size" type="range" min="50" max="100" value="78">
    </div>
    <div class="field">
      <div class="lab"><label for="ringw">Anel</label><output id="ringwV"></output></div>
      <input id="ringw" type="range" min="4" max="22" value="13">
    </div>
    <div class="field">
      <div class="lab"><label for="temp">Temperatura</label><output id="tempV"></output></div>
      <input id="temp" type="range" min="-100" max="100" value="0">
    </div>
    <div class="field">
      <div class="lab"><label for="bgl">Luz ambiente</label><output id="bglV"></output></div>
      <input id="bgl" type="range" min="55" max="100" value="82">
    </div>
    <div class="switch"><span>Espelhar selfie</span><button class="tog" id="tMirror" aria-pressed="true" aria-label="Espelhar selfie"></button></div>
  </div>

  <div class="bar glass">
    <button class="ico" id="setBtn" aria-label="Ajustes" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
    <button id="shot" aria-label="Tirar foto"><i></i></button>
    <button class="ico" id="flip" aria-label="Trocar câmera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16m0 4v-4h-4"/></svg>
    </button>
  </div>
</div>

<!-- abertura -->
<section class="screen" id="start">
  <span class="eyebrow">Ring light</span>
  <div class="mid">
    <div class="halo" aria-hidden="true"></div>
    <h1 class="mark">Luz de <em>Rosto</em></h1>
    <p class="lead">A tela se torna sua luz de estúdio. Para o melhor resultado, deixe o brilho do iPhone no máximo.</p>
  </div>
  <div class="cta">
    <button class="pill" id="go">Iniciar</button>
    <p class="note" id="err" role="alert"></p>
  </div>
</section>

<!-- resultado -->
<section class="screen" id="result" hidden>
  <img id="resImg" alt="Sua foto">
  <span id="resInfo"></span>
  <div class="cta">
    <button class="pill" id="saveBtn">Salvar</button>
    <button class="link" id="again">Refazer</button>
  </div>
  <p class="hint">No menu do iPhone, toque em Salvar Imagem.</p>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const vid = $('vid'), win = $('win'), ring = $('ring'), root = document.documentElement, body = document.body;
  let stream = null, facing = 'user', lastBlob = null, live = false;
  const opt = {flash:true, timer:false, mirror:true, frame:false};

  // ---------- luz ----------
  function applyLight(){
    const t = +$('temp').value/100;
    const n=[255,255,255], w=[255,204,148], c=[176,212,255], to=t>=0?w:c, k=Math.abs(t);
    const col = n.map((v,i)=>Math.round(v+(to[i]-v)*k));
    root.style.setProperty('--light', `rgb(${col.join(',')})`);
    root.style.setProperty('--bgdim', (+$('bgl').value/100).toFixed(2));
    if (live) document.querySelector('meta[name=theme-color]').setAttribute('content', `rgb(${col.join(',')})`);
    $('tempV').textContent = Math.round(5600 + (-t)*1400) + ' K';
    $('bglV').textContent = $('bgl').value + '%';
  }

  // ---------- geometria ----------
  function layout(){
    const W = innerWidth, H = innerHeight;
    const topB = $('top').getBoundingClientRect().bottom;
    const barTop = document.querySelector('.bar').getBoundingClientRect().top;
    const availTop = topB + 14, availH = barTop - 14 - availTop;
    const cy = availTop + availH/2, cx = W/2;
    const s = +$('size').value/100;
    const ringPx = Math.round(Math.min(W, availH) * (+$('ringw').value/100));
    let w, h;
    if (opt.frame){ h = Math.min(availH - ringPx*2, (W - ringPx*2 - 24) * 4/3) * s; w = h * 3/4; }
    else { w = h = Math.min(W - ringPx*2 - 24, availH - ringPx*2) * s; }
    const place = (el, ww, hh) => Object.assign(el.style, {left:(cx-ww/2)+'px', top:(cy-hh/2)+'px', width:ww+'px', height:hh+'px'});
    place(win, w, h); place(ring, w + ringPx*2, h + ringPx*2);
    $('count').style.top = cy + 'px';
    [win, ring].forEach(el => { el.classList.toggle('circle', !opt.frame); el.classList.toggle('frame', opt.frame); });
    $('sizeV').textContent = $('size').value + '%';
    $('ringwV').textContent = $('ringw').value;
  }

  ['temp','bgl'].forEach(id => $(id).addEventListener('input', applyLight));
  ['size','ringw'].forEach(id => $(id).addEventListener('input', layout));
  addEventListener('resize', layout);

  // ---------- controles ----------
  function toggle(btn, key, fn){
    btn.addEventListener('click', () => { opt[key] = !opt[key]; btn.setAttribute('aria-pressed', String(opt[key])); fn && fn(); });
  }
  toggle($('tView'), 'frame', layout);
  toggle($('tFlash'), 'flash');
  toggle($('tTimer'), 'timer');
  toggle($('tMirror'), 'mirror', () => body.classList.toggle('nomirror', facing !== 'user' || !opt.mirror));
  $('setBtn').addEventListener('click', () => {
    const open = $('sheet').hidden;
    $('sheet').hidden = !open;
    $('setBtn').setAttribute('aria-expanded', String(open));
  });
  // toque fora do painel fecha
  document.addEventListener('pointerdown', e => {
    if (!$('sheet').hidden && !e.target.closest('#sheet') && !e.target.closest('#setBtn')){
      $('sheet').hidden = true; $('setBtn').setAttribute('aria-expanded','false');
    }
  });

  // ---------- camera ----------
  async function startCam(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:facing, width:{ideal:4032}, height:{ideal:3024}, aspectRatio:{ideal:4/3}}
    });
    vid.srcObject = stream;
    await vid.play().catch(()=>{});
    body.classList.toggle('nomirror', facing !== 'user' || !opt.mirror);
  }
  async function keepAwake(){ try { await navigator.wakeLock?.request('screen'); } catch(e){} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });

  $('go').addEventListener('click', async () => {
    $('err').textContent = '';
    if (!navigator.mediaDevices?.getUserMedia){ $('err').textContent = 'Este navegador não libera a câmera. Abra o link no Safari.'; return; }
    try {
      await startCam();
      live = true; $('start').hidden = true; applyLight(); layout(); keepAwake();
    } catch(e){
      $('err').textContent = window.top !== window.self
        ? 'A câmera fica bloqueada dentro de outra página. Abra o link próprio do app no Safari.'
        : 'Câmera sem permissão. No Safari, toque em “aA”, depois em Ajustes do Site, e permita a Câmera.';
    }
  });
  $('flip').addEventListener('click', async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCam(); } catch(e){ facing = 'user'; startCam(); }
  });

  // ---------- foto 3:4, quadro inteiro ----------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let busy = false;
  async function capture(){
    if (!stream || busy) return;
    busy = true;
    $('sheet').hidden = true;
    if (opt.timer){
      const c = $('count'); c.hidden = false;
      for (let i=3;i>0;i--){ c.textContent = i; await wait(1000); }
      c.hidden = true;
    }
    if (opt.flash){ $('flash').classList.add('on'); await wait(450); }

    const vw = vid.videoWidth, vh = vid.videoHeight, target = 3/4;
    let sw = vw, sh = vh, sx = 0, sy = 0;
    if (vw/vh > target){ sw = Math.round(vh*target); sx = Math.round((vw-sw)/2); }
    else { sh = Math.round(vw/target); sy = Math.round((vh-sh)/2); }

    const cv = document.createElement('canvas');
    cv.width = sw; cv.height = sh;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (facing === 'user' && opt.mirror){ ctx.translate(sw,0); ctx.scale(-1,1); }
    ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);

    if (opt.flash){ await wait(90); $('flash').classList.remove('on'); }

    cv.toBlob(b => {
      busy = false;
      if (!b) return;
      lastBlob = b;
      $('resImg').src = URL.createObjectURL(b);
      $('resInfo').textContent = `${sw} × ${sh}  ·  JPEG  ·  ${(b.size/1048576).toFixed(1)} MB`;
      $('result').hidden = false;
      document.querySelector('meta[name=theme-color]').setAttribute('content', '#0b0b0a');
    }, 'image/jpeg', 1);
  }
  $('shot').addEventListener('click', capture);

  // ---------- salvar ----------
  function fileName(){
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    return `IMG_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  }
  $('saveBtn').addEventListener('click', async () => {
    if (!lastBlob) return;
    const file = new File([lastBlob], fileName(), {type:'image/jpeg'});
    if (navigator.canShare?.({files:[file]})){
      try { await navigator.share({files:[file]}); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob); a.download = file.name; a.click();
  });
  $('again').addEventListener('click', () => { $('result').hidden = true; applyLight(); });

  applyLight(); layout();
})();
</script>
</body>
</html>
